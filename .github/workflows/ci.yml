name: CI

# Pull requests run once (as pull_request), main once per push; a newer push
# to a pull request cancels the run still going. Each push to main is a
# group of its own: in one group a third push would cancel the second's run
# while it waited.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build
  # Installs LLVM 15 and the Blackfin toolchain (cached), builds emu, disasm
  # and the test ELFs (assembled and linked), and uploads them for the jobs
  # that run them. The C++ tests build and run in unit-test, alongside.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: full-build
          toolchain: "true"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR=$BCORE_STENCIL_CACHE_DIR \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON \
            -DBCORE_PERF_JIT_EVENTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target emu disasm link-tests

      - name: ccache statistics
        run: ccache -s

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/disasm
            build/emu
            build/test_linked/
            build/test_objects/
            build/test_config.py

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1b: The test programs alone, for the macOS runners, which build their
  # own emu but have no Blackfin toolchain. Assembling and linking them takes
  # seconds, so they need not wait the minutes the build job takes (most of
  # it the stencils, when they change). LLVM only for CMake's configure.
  # ──────────────────────────────────────────────────────────────────────────
  test-elfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          toolchain: "true"

      - name: Configure (CMake)
        run: cmake -B build -DLLVM_DIR=$BCORE_LLVM_DIR -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target link-tests

      - name: Upload test programs
        uses: actions/upload-artifact@v4
        with:
          name: test-elfs
          path: build/test_linked/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: C++ tests, one build configuration each
  # Each configuration builds every test and runs them at once (ctest -j);
  # the slow ones carry a COST in CMakeLists.txt so that they start first.
  # Every test runs in every configuration but default, which leaves out
  # those labelled slow; a new test needs no entry here. full and noprof
  # take two runners each (ctest -I: every other test). No bfin toolchain
  # here, so comparison_test is not registered.
  # ──────────────────────────────────────────────────────────────────────────
  unit-test:
    name: unit-test (${{ matrix.config }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The configuration of the build job.
          - config: full
            shard: 1
            shards: 2
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
              -DBCORE_PERF_JIT_EVENTS=ON
          - config: full
            shard: 2
            shards: 2
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
              -DBCORE_PERF_JIT_EVENTS=ON
          # The same tests with the instrumentation compiled out.
          - config: noprof
            shard: 1
            shards: 2
            cmake-args: >-
              -DBCORE_ENABLE_PROFILE=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          - config: noprof
            shard: 2
            shards: 2
            cmake-args: >-
              -DBCORE_ENABLE_PROFILE=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          # The core without the copy-and-patch tier, as hosts other than
          # x86-64 and AArch64 build it.
          - config: nocp
            shard: 1
            shards: 1
            cmake-args: >-
              -DBCORE_COPY_PATCH=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          # BCORE_ENABLE_PROFILE and BCORE_PERF_JIT_EVENTS at their defaults
          # (ON, OFF): full forces PERF_JIT_EVENTS=ON and noprof PROFILE=OFF,
          # so without this the defaults are never linked.
          - config: default
            shard: 1
            shards: 1
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
            ctest-args: -LE slow
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: ${{ matrix.config }}-unit

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR=$BCORE_STENCIL_CACHE_DIR \
            ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: ccache statistics
        run: ccache -s

      - name: Test
        run: |
          ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure \
            -I ${{ matrix.shard }},,${{ matrix.shards }} ${{ matrix.ctest-args }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2b: LLVM 19, the WebAssembly build's (src/llvm_compat.h), natively:
  # the C++ tests but the slow ones, and of those the loop blocks' (where
  # most of what LLVM 19 does differently is), the emulator suite in op1emu's
  # mode, and the copy-patch tier 0 against LLVM's.
  # ──────────────────────────────────────────────────────────────────────────
  llvm19:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          llvm-version: "19"
          ccache-key: llvm19
          toolchain: "true"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR=$BCORE_STENCIL_CACHE_DIR \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: ccache statistics
        run: ccache -s

      - name: Test
        run: |
          ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure -LE slow
          ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure -R loop-block

      - name: Emulator suite (O1, page table, chained)
        run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --page-table --chain --ignore-list .github/emu-ignore.txt

      - name: Copy-and-patch tier 0 against LLVM's
        run: |
          python3 tests/run_diff_test.py --matrix copy-patch --only tier0 --count-packets \
            -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2c: WebAssembly (tools/wasm/README.md): bcore built with Emscripten,
  # its blocks on the WebAssembly engine, under Node. Of the C++ tests, those
  # that need no native engine and are not labelled slow; and the emulator
  # against the build job's on every test (op1emu's mode): exit code, output
  # and packets the same.
  # ──────────────────────────────────────────────────────────────────────────
  wasm:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # emsdk and emscripten-forge's LLVM, as setup.sh pins them, and ccache:
      # each saved as soon as it is made, whatever the job does after.
      - name: Restore the WebAssembly tools
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bcore-wasm
          key: bcore-wasm-${{ hashFiles('tools/wasm/setup.sh') }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-wasm-${{ github.sha }}
          restore-keys: ccache-wasm-

      # Node 24 runs the tests, not emsdk's Node 20, whose V8 gives every
      # instance a copy of the function table it imports: thousands of
      # blocks' modules ran it out of memory (tier_test).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
          tools/wasm/setup.sh
          {
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=400M"
          } >> "$GITHUB_ENV"

      - name: Save the WebAssembly tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bcore-wasm
          key: bcore-wasm-${{ hashFiles('tools/wasm/setup.sh') }}

      - name: Configure and build
        run: |
          ccache -z
          source ~/.cache/bcore-wasm/emsdk/emsdk_env.sh
          emcmake cmake -B build-wasm \
            -DLLVM_DIR=$HOME/.cache/bcore-wasm/llvm/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CROSSCOMPILING_EMULATOR=$(command -v node) \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON
          cmake --build build-wasm -j$(getconf _NPROCESSORS_ONLN)
          ccache -s

      - name: Save ccache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-wasm-${{ github.sha }}

      - name: Test
        run: ctest --test-dir build-wasm -j$(getconf _NPROCESSORS_ONLN) --output-on-failure -LE slow -E comparison_test

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Against the native emulator
        run: |
          chmod +x build/emu
          python3 tests/run_diff_test.py --emu build-wasm/emu.js --base-emu build/emu \
            --matrix standard --only O1-paged-chain --count-packets \
            -j $(getconf _NPROCESSORS_ONLN) -t 120 --ignore-list .github/emu-ignore.txt

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Emulator test suite, one suite per job
  # Every suite skips the tests in .github/emu-ignore.txt; a warning
  # (non-failing) is printed for any ignored test that unexpectedly passes,
  # prompting cleanup of the list.
  # ──────────────────────────────────────────────────────────────────────────
  emu-test:
    name: emu-test (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: O0
            run: python3 tests/run_emu_test.py --no-fail-fast --ignore-list .github/emu-ignore.txt
          # The same suite through the O1 IR pass pipeline, the level op1emu
          # runs. -O 0 never invokes the pipeline, so only this catches IR
          # that the passes miscompile (e.g. poison the backend alone
          # tolerated). Compile-heavy tests take ~15 s at O1, hence the
          # longer timeout.
          - suite: O1
            run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --ignore-list .github/emu-ignore.txt
          # The O1 suite again with every whole RAM page in
          # Memory::page_table(), so loads and stores take the JIT's inline
          # page-table path (op1emu's) and only partial pages, MMRs and
          # faults call FlatMemory.
          - suite: O1-page-table
            run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --page-table --ignore-list .github/emu-ignore.txt
          # The same with chaining (op1emu's mode): blocks run the next block
          # themselves, through native loops and the chain table.
          - suite: O1-page-table-chain
            run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --page-table --chain --ignore-list .github/emu-ignore.txt
          # Tiered compilation (promotions on the worker) against untiered,
          # and (diff-copy-patch) the copy-and-patch tier 0 against LLVM's:
          # every test's exit code, output, packets and returns the same (one
          # binary, two sets of flags). A few configurations of each matrix:
          # the whole matrices take about 40 CPU-minutes.
          - suite: diff-tiers
            run: |
              python3 -m unittest tests/test_run_diff.py tests/test_capped_run.py
              python3 tests/run_diff_test.py --matrix tiers --only O1-t2-bg5 --count-packets \
                -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt
          # op1emu's tiering: size-scaled thresholds, and the light tier-1
          # pipeline over copy-and-patch tier 0.
          - suite: diff-tiers-ref-light
            run: |
              python3 tests/run_diff_test.py --matrix tiers --only O1-cp-t2-ref2,O1-cp-t1-light --count-packets \
                -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt
          - suite: diff-copy-patch
            run: |
              python3 tests/run_diff_test.py --matrix copy-patch --only tier0 --count-packets \
                -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt
          # CpuState::packets against single-stepping (--max-steps 1), where
          # every run enters one packet. Long tests time out single-stepped
          # and are reported as skipped.
          - suite: packet-count
            run: python3 tests/run_packet_count_test.py -t 60 --ignore-list .github/emu-ignore.txt
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Fix binary permissions
        run: chmod +x build/disasm build/emu

      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.run }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: macOS on Apple silicon (AArch64, Mach-O, MAP_JIT)
  # With the AArch64 stencils (the copy-and-patch tier 0). A macOS runner
  # has three cores, and an account runs five macOS jobs at a time: one
  # runs the C++ tests (from the start), four the emulator suites on
  # test-elfs' programs, about as long as each other (each suite takes ~2
  # min there). Every job builds what it runs, configured alike so that all
  # share one ccache and stencil cache, the last run's (they run at once):
  # the suites' jobs build only emu and restore it, the C++ tests' job,
  # which builds everything, saves it.
  # ──────────────────────────────────────────────────────────────────────────
  macos-unit:
    name: macos (arm64, unit-test)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: macos-arm64

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR="$BCORE_STENCIL_CACHE_DIR" \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: ccache statistics
        run: ccache -s

      - name: C++ tests
        run: ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure

  macos-emu:
    name: macos (arm64, ${{ matrix.a-name }}${{ matrix.b-name && format(' + {0}', matrix.b-name) || '' }})
    needs: test-elfs
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - a-name: O1-page-table-chain
            a-run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --page-table --chain --ignore-list .github/emu-ignore.txt
            b-name: O0
            b-run: python3 tests/run_emu_test.py --no-fail-fast --ignore-list .github/emu-ignore.txt
          - a-name: O1-page-table
            a-run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --page-table --ignore-list .github/emu-ignore.txt
            b-name: packet-count
            b-run: python3 tests/run_packet_count_test.py -t 60 --ignore-list .github/emu-ignore.txt
          - a-name: O1
            a-run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --ignore-list .github/emu-ignore.txt
            b-name: diff-copy-patch
            b-run: |
              python3 tests/run_diff_test.py --matrix copy-patch --only tier0 --count-packets \
                -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt
          - a-name: diff-tiers
            a-run: |
              python3 -m unittest tests/test_run_diff.py tests/test_capped_run.py
              python3 tests/run_diff_test.py --matrix tiers --only O1-t2-bg5 --count-packets \
                -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt
            b-name: diff-tiers-ref-light
            b-run: |
              python3 tests/run_diff_test.py --matrix tiers --only O1-cp-t2-ref2,O1-cp-t1-light --count-packets \
                -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: macos-arm64
          ccache-save: "false"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR="$BCORE_STENCIL_CACHE_DIR" \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target emu

      - name: ccache statistics
        run: ccache -s

      - name: Download test programs
        uses: actions/download-artifact@v4
        with:
          name: test-elfs
          path: build/test_linked/

      - name: ${{ matrix.a-name }}
        run: ${{ matrix.a-run }}
      - name: ${{ matrix.b-name }}
        if: matrix.b-name && (success() || failure())
        run: ${{ matrix.b-run || 'true' }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4b: Linux on AArch64 (ELF, no MAP_JIT): the AArch64 stencils on
  # another host than Apple's. Two jobs run the C++ tests (every other one,
  # the stencils' differential test too), two the emulator suites that run
  # the copy-and-patch tier 0, on test-elfs' programs. Shared caches as
  # macOS's (both test jobs save; either is a whole build).
  # ──────────────────────────────────────────────────────────────────────────
  linux-arm64-unit:
    name: linux (arm64, unit-test ${{ matrix.shard }}/2)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: linux-arm64

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR="$BCORE_STENCIL_CACHE_DIR" \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: ccache statistics
        run: ccache -s

      - name: C++ tests
        run: ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure -I ${{ matrix.shard }},,2

  linux-arm64-emu:
    name: linux (arm64, ${{ matrix.a-name }} + ${{ matrix.b-name }})
    needs: test-elfs
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - a-name: diff-copy-patch
            a-run: |
              python3 tests/run_diff_test.py --matrix copy-patch --only tier0,t2-bg1 --count-packets \
                -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt
            b-name: O1-page-table-chain
            b-run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --page-table --chain --ignore-list .github/emu-ignore.txt
          - a-name: diff-tiers-ref-light
            a-run: |
              python3 tests/run_diff_test.py --matrix tiers --only O1-cp-t2-ref2,O1-cp-t1-light --count-packets \
                -j $(getconf _NPROCESSORS_ONLN) -t 60 --ignore-list .github/emu-ignore.txt
            b-name: packet-count
            b-run: python3 tests/run_packet_count_test.py -t 60 --ignore-list .github/emu-ignore.txt
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: linux-arm64
          ccache-save: "false"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR="$BCORE_STENCIL_CACHE_DIR" \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target emu

      - name: ccache statistics
        run: ccache -s

      - name: Download test programs
        uses: actions/download-artifact@v4
        with:
          name: test-elfs
          path: build/test_linked/

      - name: ${{ matrix.a-name }}
        run: ${{ matrix.a-run }}
      - name: ${{ matrix.b-name }}
        if: success() || failure()
        run: ${{ matrix.b-run }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Disassembler comparison test and benchmark, a few seconds each
  # run_comparison_test.py compares build/disasm output against
  # bfin-elf-objdump for every assembled object file. bench.s.elf must exit
  # 0 (CHECKREG assertions pass); its wall-clock time goes to the job
  # summary.
  # ──────────────────────────────────────────────────────────────────────────
  disasm-and-benchmark:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          toolchain: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Fix binary permissions
        run: chmod +x build/disasm build/emu

      - name: Run disassembler comparison test
        run: python3 tests/run_comparison_test.py --no-fail-fast

      - name: Run benchmark
        if: success() || failure()
        run: |
          START=$(date +%s%N)
          EXIT_CODE=0
          ./build/emu build/test_linked/bench.s.elf || EXIT_CODE=$?
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))

          echo "Benchmark elapsed: ${ELAPSED_MS} ms"

          {
            echo "### Benchmark Result"
            echo ""
            echo "| Test | Wall Time | Status |"
            echo "|------|-----------|--------|"
            if [ $EXIT_CODE -eq 0 ]; then
              echo "| bench.s | ${ELAPSED_MS} ms | PASS |"
            else
              echo "| bench.s | ${ELAPSED_MS} ms | FAIL (exit ${EXIT_CODE}) |"
            fi
          } >> $GITHUB_STEP_SUMMARY

          exit $EXIT_CODE
