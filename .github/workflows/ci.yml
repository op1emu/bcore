name: CI

# Pull requests run once (as pull_request), main once per push; a newer push
# to a pull request cancels the run still going. Each push to main is a
# group of its own: in one group a third push would cancel the second's run
# while it waited.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An account on the free plan runs 20 jobs at a time, macOS's, Linux arm64's
# and the last ones of this run included (5 of them on macOS): what waits
# for a runner waits longest. So no job waits for more than the one it takes
# its input from, the long C++ tests start with the run, and a job's work is
# a few minutes or more, not the minute its setup takes. The emulator suites
# go by name (.github/run-suites.sh): a job lists those it runs.
jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build
  # Installs LLVM 15 and the Blackfin toolchain (cached), builds emu, disasm
  # and the test ELFs (assembled and linked), and uploads them for the jobs
  # that run them, and nothing else: they all wait for it. The C++ tests
  # build and run in unit-test, alongside.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: full-build
          toolchain: "true"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR=$BCORE_STENCIL_CACHE_DIR \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON \
            -DBCORE_PERF_JIT_EVENTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target emu disasm link-tests

      - name: ccache statistics
        run: ccache -s

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/disasm
            build/emu
            build/test_linked/
            build/test_objects/
            build/test_config.py
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1b: The test programs alone, for the macOS runners, which build their
  # own emu but have no Blackfin toolchain. Assembling and linking them takes
  # seconds, so they need not wait the minutes the build job takes (most of
  # it the stencils, when they change). LLVM only for CMake's configure.
  # ──────────────────────────────────────────────────────────────────────────
  test-elfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          toolchain: "true"

      - name: Configure (CMake)
        run: cmake -B build -DLLVM_DIR=$BCORE_LLVM_DIR -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target link-tests

      - name: Upload test programs
        uses: actions/upload-artifact@v4
        with:
          name: test-elfs
          path: build/test_linked/
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: C++ tests, one build configuration each
  # Each configuration builds every test and runs them at once (ctest -j);
  # the slow ones carry a COST in CMakeLists.txt so that they start first.
  # Every test runs in every configuration but default, which leaves out
  # those labelled slow; a new test needs no entry here. full and noprof
  # take two runners each (ctest -I: every other test). No bfin toolchain
  # here, so comparison_test is not registered.
  # ──────────────────────────────────────────────────────────────────────────
  unit-test:
    name: unit-test (${{ matrix.config }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The configuration of the build job.
          - config: full
            shard: 1
            shards: 2
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
              -DBCORE_PERF_JIT_EVENTS=ON
          - config: full
            shard: 2
            shards: 2
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
              -DBCORE_PERF_JIT_EVENTS=ON
          # The same tests with the instrumentation compiled out.
          - config: noprof
            shard: 1
            shards: 2
            cmake-args: >-
              -DBCORE_ENABLE_PROFILE=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          - config: noprof
            shard: 2
            shards: 2
            cmake-args: >-
              -DBCORE_ENABLE_PROFILE=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          # The core without the copy-and-patch tier, as hosts other than
          # x86-64 and AArch64 build it.
          - config: nocp
            shard: 1
            shards: 1
            cmake-args: >-
              -DBCORE_COPY_PATCH=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          # BCORE_ENABLE_PROFILE and BCORE_PERF_JIT_EVENTS at their defaults
          # (ON, OFF): full forces PERF_JIT_EVENTS=ON and noprof PROFILE=OFF,
          # so without this the defaults are never linked.
          - config: default
            shard: 1
            shards: 1
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
            ctest-args: -LE slow
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: ${{ matrix.config }}-unit

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR=$BCORE_STENCIL_CACHE_DIR \
            ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: ccache statistics
        run: ccache -s

      - name: Test
        run: |
          ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure \
            -I ${{ matrix.shard }},,${{ matrix.shards }} ${{ matrix.ctest-args }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Emulator test suites (.github/run-suites.sh) on the build job's
  # emu, in four jobs about as long as each other (~5 min): the longest
  # suite alone, the others two or more to a job. The disassembler's
  # comparison with bfin-elf-objdump and the benchmark, seconds each, go
  # with the shortest.
  # ──────────────────────────────────────────────────────────────────────────
  emu-test:
    name: emu-test (${{ join(matrix.suites, ' + ') }})
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suites:
          - [diff-tiers-ref-light]
          - [O1-page-table-chain, packet-count]
          - [O1-page-table, script-tests, diff-tiers]
          - [O1, diff-copy-patch, O0, disasm, benchmark]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          toolchain: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Fix binary permissions
        run: chmod +x build/disasm build/emu

      - name: ${{ join(matrix.suites, ' + ') }}
        run: .github/run-suites.sh ${{ join(matrix.suites, ' ') }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3b: LLVM 23, the WebAssembly build's LLVM, on Linux x86-64 (without
  # the copy-and-patch tier, whose stencils are LLVM 15's): the C++ tests
  # from the start, and the emulator suite in op1emu's mode and at O0 on
  # test-elfs' programs, in a job of its own (they took as long again after
  # the C++ tests). What LLVM 23 does differently shows here first, apart
  # from what WebAssembly does. Both jobs configured alike, so that they
  # share one ccache; the C++ tests' job, which builds everything, saves it.
  # ──────────────────────────────────────────────────────────────────────────
  llvm23-unit:
    name: linux (LLVM 23, unit-test)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          llvm-version: "23"
          ccache-key: llvm23

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: ccache statistics
        run: ccache -s

      - name: C++ tests
        run: ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure

  llvm23-emu:
    name: linux (LLVM 23, O1-page-table-chain + O0)
    needs: test-elfs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          llvm-version: "23"
          ccache-key: llvm23
          ccache-save: "false"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target emu

      - name: ccache statistics
        run: ccache -s

      - name: Download test programs
        uses: actions/download-artifact@v4
        with:
          name: test-elfs
          path: build/test_linked/

      - name: O1-page-table-chain + O0
        run: .github/run-suites.sh O1-page-table-chain O0

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3c: WebAssembly (tools/wasm/README.md), in Node 24: the core built
  # with Emscripten 4.0.9 and emscripten-forge's LLVM 23
  # (.github/actions/setup-wasm). Its C++ tests from the start, and its emu
  # against the build job's native one, every test's exit code, output and
  # packets the same, at O0 (raw memory) and O1 paged chained: a third of
  # the tests on each of three runners (run_diff_test.py --shard), which
  # build the emu themselves (seconds, from the ccache). The C++ tests' job,
  # which builds everything, saves the tools and the ccache, as soon as they
  # are there: a job that times out still leaves them for the next.
  # ──────────────────────────────────────────────────────────────────────────
  wasm-unit:
    name: wasm (Node, unit-test)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-wasm
        with:
          save-tools: "true"

      - name: Build
        run: |
          source "$BCORE_EMSDK_ENV"
          ccache -z
          cmake --build build-wasm -j$(getconf _NPROCESSORS_ONLN)
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-wasm-${{ github.sha }}

      - name: C++ tests
        run: ctest --test-dir build-wasm -j$(getconf _NPROCESSORS_ONLN) --output-on-failure

  wasm-emu:
    name: wasm (Node, O0 + O1-paged-chain ${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-wasm

      - name: Build
        run: |
          source "$BCORE_EMSDK_ENV"
          ccache -z
          cmake --build build-wasm -j$(getconf _NPROCESSORS_ONLN) --target emu
          ccache -s

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Against the native emu, O0 and O1-paged-chain
        run: |
          chmod +x build/emu build-wasm/emu-node
          python3 tests/run_diff_test.py --emu build-wasm/emu-node --base-emu build/emu \
            --matrix standard --only O0,O1-paged-chain --count-packets --shard ${{ matrix.shard }}/3 \
            -j $(getconf _NPROCESSORS_ONLN) -t 120 --ignore-list .github/emu-ignore.txt

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: macOS on Apple silicon (AArch64, Mach-O, MAP_JIT)
  # With the AArch64 stencils (the copy-and-patch tier 0). A macOS runner
  # has three cores, and an account runs five macOS jobs at a time: two run
  # the C++ tests (every other one, from the start), three the emulator
  # suites on test-elfs' programs, about as long as each other (~5.5 min
  # there). Every job builds what it runs, configured alike so that all
  # share one ccache and stencil cache, the last run's (they run at once):
  # the suites' jobs build only emu and restore it, the C++ tests' jobs,
  # which build everything, save it (either is a whole build).
  # ──────────────────────────────────────────────────────────────────────────
  macos-unit:
    name: macos (arm64, unit-test ${{ matrix.shard }}/2)
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: macos-arm64

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR="$BCORE_STENCIL_CACHE_DIR" \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: ccache statistics
        run: ccache -s

      - name: C++ tests
        run: ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure -I ${{ matrix.shard }},,2

  macos-emu:
    name: macos (arm64, ${{ join(matrix.suites, ' + ') }})
    needs: test-elfs
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suites:
          - [diff-tiers-ref-light, O0]
          - [script-tests, diff-tiers, O1-page-table-chain, diff-copy-patch]
          - [O1, O1-page-table, packet-count]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: macos-arm64
          ccache-save: "false"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR="$BCORE_STENCIL_CACHE_DIR" \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target emu

      - name: ccache statistics
        run: ccache -s

      - name: Download test programs
        uses: actions/download-artifact@v4
        with:
          name: test-elfs
          path: build/test_linked/

      - name: ${{ join(matrix.suites, ' + ') }}
        run: .github/run-suites.sh ${{ join(matrix.suites, ' ') }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4b: Linux on AArch64 (ELF, no MAP_JIT): the AArch64 stencils on
  # another host than Apple's. Two jobs run the C++ tests (every other one,
  # the stencils' differential test too), two the emulator suites that run
  # the copy-and-patch tier 0, on test-elfs' programs. Shared caches as
  # macOS's (both test jobs save; either is a whole build).
  # ──────────────────────────────────────────────────────────────────────────
  linux-arm64-unit:
    name: linux (arm64, unit-test ${{ matrix.shard }}/2)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: linux-arm64

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR="$BCORE_STENCIL_CACHE_DIR" \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: ccache statistics
        run: ccache -s

      - name: C++ tests
        run: ctest --test-dir build -j$(getconf _NPROCESSORS_ONLN) --output-on-failure -I ${{ matrix.shard }},,2

  linux-arm64-emu:
    name: linux (arm64, ${{ join(matrix.suites, ' + ') }})
    needs: test-elfs
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suites:
          - [diff-copy-patch, diff-copy-patch-t2-bg1, O1-page-table-chain]
          - [diff-tiers-ref-light, packet-count]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: linux-arm64
          ccache-save: "false"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR="$BCORE_LLVM_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR="$BCORE_STENCIL_CACHE_DIR" \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON

      - name: Build
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN) --target emu

      - name: ccache statistics
        run: ccache -s

      - name: Download test programs
        uses: actions/download-artifact@v4
        with:
          name: test-elfs
          path: build/test_linked/

      - name: ${{ join(matrix.suites, ' + ') }}
        run: .github/run-suites.sh ${{ join(matrix.suites, ' ') }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Every job's result in one check, the one for a branch rule to
  # require: jobs come and go and change their names (a matrix entry's is
  # its suites), this one stays. Every job must succeed: none is skipped
  # but for one it waits for failing.
  # ──────────────────────────────────────────────────────────────────────────
  ci-status:
    if: always()
    needs:
      - build
      - test-elfs
      - unit-test
      - emu-test
      - llvm23-unit
      - llvm23-emu
      - wasm-unit
      - wasm-emu
      - macos-unit
      - macos-emu
      - linux-arm64-unit
      - linux-arm64-emu
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
