name: CI

# Pull requests run once (as pull_request), main once per push; a newer push
# to a pull request cancels the run still going.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build
  # Installs LLVM 15 and the Blackfin toolchain (cached), builds emu, disasm
  # and the test ELFs (assembled and linked), and uploads them for the jobs
  # that run them. The C++ tests build and run in unit-test, alongside.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: full-build
          toolchain: "true"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR=$BCORE_STENCIL_CACHE_DIR \
            -DBCORE_BUILD_PROFILE_TESTS=ON \
            -DBCORE_BUILD_FAULT_TESTS=ON \
            -DBCORE_PERF_JIT_EVENTS=ON

      - name: Build
        run: cmake --build build -j$(nproc) --target emu disasm link-tests

      - name: ccache statistics
        run: ccache -s

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/disasm
            build/emu
            build/test_linked/
            build/test_objects/
            build/test_config.py

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: C++ tests, one build configuration each
  # Each configuration builds every test and runs them at once (ctest -j);
  # the slow ones carry a COST in CMakeLists.txt so that they start first.
  # Every test runs in every configuration but default, which leaves out
  # those labelled slow; a new test needs no entry here. full and noprof
  # take two runners each (ctest -I: every other test). No bfin toolchain
  # here, so comparison_test is not registered.
  # ──────────────────────────────────────────────────────────────────────────
  unit-test:
    name: unit-test (${{ matrix.config }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The configuration of the build job.
          - config: full
            shard: 1
            shards: 2
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
              -DBCORE_PERF_JIT_EVENTS=ON
          - config: full
            shard: 2
            shards: 2
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
              -DBCORE_PERF_JIT_EVENTS=ON
          # The same tests with the instrumentation compiled out.
          - config: noprof
            shard: 1
            shards: 2
            cmake-args: >-
              -DBCORE_ENABLE_PROFILE=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          - config: noprof
            shard: 2
            shards: 2
            cmake-args: >-
              -DBCORE_ENABLE_PROFILE=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          # The core without the copy-and-patch tier, as hosts other than
          # x86-64 build it.
          - config: nocp
            shard: 1
            shards: 1
            cmake-args: >-
              -DBCORE_COPY_PATCH=OFF
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
          # BCORE_ENABLE_PROFILE and BCORE_PERF_JIT_EVENTS at their defaults
          # (ON, OFF): full forces PERF_JIT_EVENTS=ON and noprof PROFILE=OFF,
          # so without this the defaults are never linked.
          - config: default
            shard: 1
            shards: 1
            cmake-args: >-
              -DBCORE_BUILD_PROFILE_TESTS=ON
              -DBCORE_BUILD_FAULT_TESTS=ON
            ctest-args: -LE slow
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          llvm: "true"
          ccache-key: ${{ matrix.config }}-unit

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBCORE_STENCIL_CACHE_DIR=$BCORE_STENCIL_CACHE_DIR \
            ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: ccache statistics
        run: ccache -s

      - name: Test
        run: |
          ctest --test-dir build -j$(nproc) --output-on-failure \
            -I ${{ matrix.shard }},,${{ matrix.shards }} ${{ matrix.ctest-args }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Emulator test suite, one suite per job
  # Every suite skips the tests in .github/emu-ignore.txt; a warning
  # (non-failing) is printed for any ignored test that unexpectedly passes,
  # prompting cleanup of the list.
  # ──────────────────────────────────────────────────────────────────────────
  emu-test:
    name: emu-test (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: O0
            run: python3 tests/run_emu_test.py --no-fail-fast --ignore-list .github/emu-ignore.txt
          # The same suite through the O1 IR pass pipeline, the level op1emu
          # runs. -O 0 never invokes the pipeline, so only this catches IR
          # that the passes miscompile (e.g. poison the backend alone
          # tolerated). Compile-heavy tests take ~15 s at O1, hence the
          # longer timeout.
          - suite: O1
            run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --ignore-list .github/emu-ignore.txt
          # The O1 suite again with every whole RAM page in
          # Memory::page_table(), so loads and stores take the JIT's inline
          # page-table path (op1emu's) and only partial pages, MMRs and
          # faults call FlatMemory.
          - suite: O1-page-table
            run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --page-table --ignore-list .github/emu-ignore.txt
          # The same with chaining (op1emu's mode): blocks run the next block
          # themselves, through native loops and the chain table.
          - suite: O1-page-table-chain
            run: python3 tests/run_emu_test.py --no-fail-fast -O 1 -t 60 --page-table --chain --ignore-list .github/emu-ignore.txt
          # Tiered compilation (promotions on the worker) against untiered,
          # and (diff-copy-patch) the copy-and-patch tier 0 against LLVM's:
          # every test's exit code, output, packets and returns the same (one
          # binary, two sets of flags). A few configurations of each matrix:
          # the whole matrices take about 40 CPU-minutes.
          - suite: diff-tiers
            run: |
              python3 -m unittest tests/test_run_diff.py
              python3 tests/run_diff_test.py --matrix tiers --only O1-t2-bg5 --count-packets \
                -j $(nproc) -t 60 --ignore-list .github/emu-ignore.txt
          # op1emu's tiering: size-scaled thresholds, and the light tier-1
          # pipeline over copy-and-patch tier 0.
          - suite: diff-tiers-ref-light
            run: |
              python3 tests/run_diff_test.py --matrix tiers --only O1-cp-t2-ref2,O1-cp-t1-light --count-packets \
                -j $(nproc) -t 60 --ignore-list .github/emu-ignore.txt
          - suite: diff-copy-patch
            run: |
              python3 tests/run_diff_test.py --matrix copy-patch --only tier0 --count-packets \
                -j $(nproc) -t 60 --ignore-list .github/emu-ignore.txt
          # CpuState::packets against single-stepping (--max-steps 1), where
          # every run enters one packet. Long tests time out single-stepped
          # and are reported as skipped.
          - suite: packet-count
            run: python3 tests/run_packet_count_test.py -t 60 --ignore-list .github/emu-ignore.txt
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Fix binary permissions
        run: chmod +x build/disasm build/emu

      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.run }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Disassembler comparison test and benchmark, a few seconds each
  # run_comparison_test.py compares build/disasm output against
  # bfin-elf-objdump for every assembled object file. bench.s.elf must exit
  # 0 (CHECKREG assertions pass); its wall-clock time goes to the job
  # summary.
  # ──────────────────────────────────────────────────────────────────────────
  disasm-and-benchmark:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          toolchain: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Fix binary permissions
        run: chmod +x build/disasm build/emu

      - name: Run disassembler comparison test
        run: python3 tests/run_comparison_test.py --no-fail-fast

      - name: Run benchmark
        if: success() || failure()
        run: |
          START=$(date +%s%N)
          EXIT_CODE=0
          ./build/emu build/test_linked/bench.s.elf || EXIT_CODE=$?
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))

          echo "Benchmark elapsed: ${ELAPSED_MS} ms"

          {
            echo "### Benchmark Result"
            echo ""
            echo "| Test | Wall Time | Status |"
            echo "|------|-----------|--------|"
            if [ $EXIT_CODE -eq 0 ]; then
              echo "| bench.s | ${ELAPSED_MS} ms | PASS |"
            else
              echo "| bench.s | ${ELAPSED_MS} ms | FAIL (exit ${EXIT_CODE}) |"
            fi
          } >> $GITHUB_STEP_SUMMARY

          exit $EXIT_CODE
